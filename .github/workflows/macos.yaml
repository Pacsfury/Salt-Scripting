name: C++ (macOS Direct)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: clang++ -std=c++20 src/*.cpp -o yarc

    - name: Test
      run: ./yarc --test
